<title>Astro Wallet</title>

<style>/* page.css — base da página: áreas seguras do celular (entalhe, barra de gestos) e valores padrão. */
:root {
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
  margin: 0;
  padding: 0;
  font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
  background: #fff;
  color: #000;
}
img {
  max-width: 100%;
}
[hidden]:not([hidden="until-found" i]) {
  display: none !important;
}

/* Astro Wallet — tokens de design.
   Direção: monocromático no estilo dos apps da Apple. Fundo branco por padrão; tema escuro só
   quando a pessoa escolhe em Ajustes > Aparência (classe .app-dark no <html>), sem seguir o sistema.
   Tipografia: Manrope em toda a interface — geométrica, elegante e muito legível; números grandes
   em peso forte com espaçamento justo. Cor só para sinalizar: âmbar perto do limite, vermelho acima.
   Layout: coluna de celular; barra superior translúcida; título grande com o mês; blocos em cinza
   muito claro sobre o branco; barra de abas com o Início destacado no centro. */
:root {
  --bg: #FFFFFF;
  --card: #F5F5F7;
  --surface: #FFFFFF;        /* campos dentro de cartões e folhas */
  --text: #0A0A0B;
  --muted: #5E5E66;
  --faint: #8E8E93;
  --sep: #E3E3E8;
  --fill: #EDEDF0;
  --fill-2: #DCDCE1;
  --accent: #0A0A0B;
  --on-accent: #FFFFFF;
  --bar-bg: rgba(255, 255, 255, .82);
  --danger: #C4111D;
  --warn: #9A5B00;
  --shade: rgba(0, 0, 0, .32);
  --sheet-shadow: 0 -10px 40px rgba(0, 0, 0, .12);
  --mark-bg: #0A0A0B;
  --mark-fg: #FFFFFF;
  --seg-on: #FFFFFF;
  --knob-on: #FFFFFF;

  --font: "Manrope", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --display: "Manrope", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --col: 480px;
  --r: 16px;
  color-scheme: light;
}

:root.app-dark {
  --bg: #000000;
  --card: #1C1C1E;
  --surface: #2C2C2E;
  --text: #F5F5F7;
  --muted: #AEAEB2;
  --faint: #8E8E93;
  --sep: #38383A;
  --fill: #2C2C2E;
  --fill-2: #3A3A3C;
  --accent: #F5F5F7;
  --on-accent: #0A0A0B;
  --bar-bg: rgba(18, 18, 20, .82);
  --danger: #FF6B6B;
  --warn: #FFB340;
  --shade: rgba(0, 0, 0, .6);
  --sheet-shadow: 0 -10px 40px rgba(0, 0, 0, .6);
  --mark-bg: #F5F5F7;
  --mark-fg: #0A0A0B;
  --seg-on: #636366;
  --knob-on: #0A0A0B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.38;
  letter-spacing: -.011em;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
/* faixa atrás da barra de status do celular */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 45; background: var(--bg); }

button { font: inherit; color: inherit; cursor: pointer; letter-spacing: inherit; }
button:disabled { cursor: default; opacity: .6; }
input, textarea { font: inherit; color: var(--text); letter-spacing: inherit; }
a { color: inherit; text-decoration: none; }
p { margin: 0; }
h1, h2 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); line-height: 1.45; padding-inline: 4px; }
.center { text-align: center; }
.in { color: var(--text); }
.out { color: var(--text); }
.bad { color: var(--danger); }
.mt { margin-top: 12px; }

svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- marca ---------- */
.mark { display: inline-grid; place-items: center; flex: none; background: var(--mark-bg); }
.mark svg { width: 100%; height: 100%; }
.mark-sm { width: 30px; height: 30px; border-radius: 8px; }
.mark-md { width: 64px; height: 64px; border-radius: 16px; }
.mark-lg { width: 92px; height: 92px; border-radius: 23px; box-shadow: 0 20px 40px -18px rgba(0, 0, 0, .45); }

.wordmark { display: inline-flex; align-items: baseline; gap: .22em; line-height: 1; white-space: nowrap; color: var(--text); }
.wordmark b { font-family: var(--display); font-weight: 800; letter-spacing: -.04em; }
.wordmark i { font-family: var(--display); font-style: normal; font-weight: 300; letter-spacing: -.02em; }
.wordmark-sm { font-size: 17px; }
.wordmark-md { font-size: 26px; }
.wordmark-lg { font-size: 36px; }

.lockup { display: inline-flex; align-items: center; gap: 9px; }
.lockup-lg { flex-direction: column; gap: 18px; }

/* ---------- casca ---------- */
#app { max-width: var(--col); margin: 0 auto; min-height: 100vh; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--bar-bg);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--sep);
}
.nav-in { display: flex; align-items: center; height: 52px; }
.nav-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--fill); font-size: 12px; font-weight: 600; letter-spacing: .02em;
}
.add {
  width: 32px; height: 32px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); font-size: 18px;
}
.add svg { stroke-width: 2.4; }
.add:active { transform: scale(.94); }

.titlebar { padding-block: 22px 4px; }
.titlebar-row { display: flex; align-items: flex-end; gap: 12px; }
.titlebar-t { flex: 1; min-width: 0; }
.eyebrow { display: block; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.large { font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1.05; letter-spacing: -.045em; margin: 4px 0 0; }
.large em { color: var(--faint); font-style: normal; font-weight: 300; letter-spacing: -.03em; white-space: nowrap; }
.mnav { display: flex; gap: 8px; padding-bottom: 6px; }
.mnav button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--fill); display: grid; place-items: center; font-size: 18px; }
.mnav button:active { background: var(--fill-2); }
.today { margin-top: 10px; background: none; border: 0; padding: 0; font-size: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--faint); }
.lead-t { margin-top: 10px; color: var(--muted); font-size: 15px; }

.hero { margin-top: 26px; }
.hero-k { font-size: 13px; color: var(--muted); font-weight: 500; }
.hero-v { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1.08; letter-spacing: -.05em; margin-top: 4px; }
.hero-v.neg { color: var(--danger); }
.spend { height: 4px; border-radius: 2px; background: var(--fill-2); overflow: hidden; margin-top: 18px; }
.spend i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.spend-t { font-size: 13px; color: var(--muted); margin-top: 8px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; margin-top: 20px; background: var(--card); border-radius: var(--r); }
.stat { padding: 14px 16px; min-width: 0; }
.stat + .stat { border-left: .5px solid var(--sep); }
.stat span { font-size: 13px; color: var(--muted); }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.2; letter-spacing: -.035em; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.35; }

.content { display: grid; gap: 10px; padding-block: 18px 12px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--bar-bg);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar-in { max-width: var(--col); margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); }
.tabbar button {
  background: none; border: 0; padding: 8px 2px 9px; min-width: 0;
  display: grid; justify-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--faint); letter-spacing: 0;
}
.tabbar button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tabbar button svg { font-size: 24px; }
.tabbar button.on { color: var(--text); }
.tabbar button.on svg { stroke-width: 2.2; }

/* ---------- telas inteiras (boas-vindas, bloqueio) ---------- */
.gate { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: var(--bg); color: var(--text); }
.gate-in {
  max-width: 400px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; justify-content: center; gap: 14px;
  padding-block: calc(40px + env(safe-area-inset-top, 0px)) calc(36px + env(safe-area-inset-bottom, 0px));
  animation: rise .45s cubic-bezier(.2, .8, .2, 1);
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.gate-brand { display: grid; justify-items: center; gap: 16px; text-align: center; }
.gate-brand p { color: var(--muted); max-width: 28ch; font-size: 15px; }
.gate-brand h1 { margin: 8px 0 0; }
.gate h1 { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.12; letter-spacing: -.04em; margin: 0; }
.gate-form { display: grid; gap: 10px; }
.gate-form.lock { text-align: center; }
.gate .sub { color: var(--muted); line-height: 1.5; margin-bottom: 8px; font-size: 15px; }
.gate .field, .gate .amount { background: var(--card); border-color: transparent; }
.gate .field:focus, .gate .amount:focus-within { border-color: var(--accent); box-shadow: none; }
.skip { background: none; border: 0; color: var(--muted); font-weight: 500; padding: 8px; justify-self: center; font-size: 15px; }
.skip:hover { color: var(--text); }
.note-light { font-size: 12px; color: var(--faint); text-align: center; }

.dots { display: flex; justify-content: center; gap: 6px; margin-block: 14px 8px; }
.dots i { height: 6px; width: 6px; border-radius: 3px; background: var(--fill-2); transition: width .3s; }
.dots i.done { background: var(--faint); }
.dots i.cur { width: 22px; background: var(--accent); }

.fp {
  width: 96px; height: 96px; border-radius: 50%; margin: 8px auto 4px; font-size: 48px;
  display: grid; place-items: center; background: var(--fill); color: var(--text);
}
.fp svg { stroke-width: 1.4; }
.fp.ok { background: var(--accent); color: var(--on-accent); animation: pop .35s ease-out; }
@keyframes pop { 50% { transform: scale(1.08); } }

.glass-card { background: var(--card); border-radius: 16px; padding: 4px 16px; }
.sumrow { display: flex; align-items: center; gap: 12px; padding-block: 12px; font-size: 15px; }
.sumrow + .sumrow { border-top: .5px solid var(--sep); }
.sumrow svg { font-size: 18px; color: var(--muted); }

/* Início no centro da barra de abas */
.tabbar button.home { color: var(--muted); }
.tabbar button.home .home-ic {
  width: 46px; height: 46px; margin-top: -20px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent); color: var(--on-accent);
  box-shadow: 0 0 0 5px var(--bg), 0 8px 18px -6px rgba(0, 0, 0, .35);
  transition: transform .15s;
}
.tabbar button.home .home-ic svg { font-size: 22px; stroke-width: 2.2; }
.tabbar button.home:active .home-ic { transform: scale(.94); }
.tabbar button.home.on { color: var(--text); font-weight: 700; }

/* aparência */
.theme-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.theme-pick button {
  border: 2px solid transparent; border-radius: 14px; padding: 10px; background: var(--surface);
  display: grid; gap: 8px; justify-items: center; font-size: 14px; font-weight: 600;
}
.theme-pick button.on { border-color: var(--accent); }
.theme-pick .prev { width: 100%; height: 64px; border-radius: 10px; padding: 8px; display: grid; gap: 5px; align-content: start; }
.theme-pick .prev i { display: block; height: 7px; border-radius: 4px; }
.theme-pick .prev.light { background: #FFFFFF; border: 1px solid #E3E3E8; }
.theme-pick .prev.light i { background: #E3E3E8; } .theme-pick .prev.light i:first-child { width: 60%; background: #0A0A0B; }
.theme-pick .prev.dark { background: #000000; border: 1px solid #38383A; }
.theme-pick .prev.dark i { background: #3A3A3C; } .theme-pick .prev.dark i:first-child { width: 60%; background: #F5F5F7; }
.theme-pick span { display: flex; align-items: center; gap: 6px; }

/* ---------- segurança e termos ---------- */
.safe { display: grid; gap: 4px; margin-top: 8px; }
.safe h1 { text-align: center; }
.safe .sub { text-align: center; }
.safe-list { list-style: none; margin: 6px 0 0; padding: 4px 16px; background: var(--card); border-radius: var(--r); }
.safe-list li { display: flex; gap: 12px; align-items: flex-start; padding-block: 12px; }
.safe-list li + li { border-top: .5px solid var(--sep); }
.safe-list li > span { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 17px; flex: none; }
.safe-list b { display: block; font-weight: 700; font-size: 15px; letter-spacing: -.02em; }
.safe-list small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 1px; }

.terms { display: grid; gap: 8px; margin-top: 6px; }
.terms-hd { display: flex; align-items: baseline; justify-content: space-between; padding-inline: 4px; }
.terms-hd b { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.terms-hd span { font-size: 12px; color: var(--faint); }
.terms-box {
  max-height: 32vh; min-height: 160px; overflow-y: auto; padding: 4px 16px 14px;
  background: var(--card); border-radius: var(--r); font-size: 13.5px; line-height: 1.55; color: var(--muted);
  -webkit-overflow-scrolling: touch;
}
.terms-box.full { max-height: none; background: none; padding: 0 4px; font-size: 15px; }
.terms-box h3 { font-size: 14px; font-weight: 700; color: var(--text); margin: 14px 0 4px; letter-spacing: -.01em; }
.terms-box.full h3 { font-size: 16px; }
.terms-box p { margin: 0; }
.terms-meta { font-size: 12px; color: var(--faint); margin-top: 12px !important; }

.check { display: flex; gap: 12px; align-items: flex-start; padding: 6px 4px; font-size: 14px; line-height: 1.45; cursor: pointer; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check .box {
  width: 24px; height: 24px; border-radius: 7px; flex: none; margin-top: 1px;
  border: 2px solid var(--fill-2); display: grid; place-items: center; color: transparent; font-size: 15px; transition: background .15s, border-color .15s;
}
.check .box svg { stroke-width: 3; }
.check input:checked + .box { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { opacity: .3; transform: none; }

/* ---------- esconder valores ---------- */
.eye { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--fill); display: grid; place-items: center; font-size: 17px; color: var(--text); }
.eye:active { transform: scale(.94); }
.eye[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.mv-h { display: none; }
.hide-values #app .mv-v { display: none; }
.hide-values #app .mv-h { display: inline; color: var(--text); letter-spacing: .04em; white-space: nowrap; }
.hide-values #app .hero-v.neg .mv-h { color: var(--danger); }

/* ---------- listas agrupadas ---------- */
.card { background: var(--card); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.card.list { padding-block: 0; }
.card.tight { padding: 0; }
.card.stack { display: grid; gap: 10px; }
.sec { display: flex; align-items: baseline; justify-content: space-between; margin: 14px 4px -2px; }
.sec h2 { margin: 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.link { background: none; border: 0; padding: 0; font-size: 14px; font-weight: 500; color: var(--text); }
.link::after { content: " ›"; color: var(--faint); }

.ci { width: 32px; height: 32px; border-radius: 8px; flex: none; display: grid; place-items: center; font-size: 17px; background: var(--fill); color: var(--text); }
.ci.sm { width: 28px; height: 28px; border-radius: 7px; font-size: 15px; }
.ci.in { background: var(--accent); color: var(--on-accent); }

.bar { height: 4px; border-radius: 2px; background: var(--fill-2); overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.bar i.warn { background: var(--warn); }
.bar i.over { background: var(--danger); }
.sub { font-size: 12px; color: var(--muted); margin-top: 6px; }

.catrow { padding-block: 12px; }
.catrow + .catrow { border-top: .5px solid var(--sep); }
.catrow-h { display: flex; align-items: center; gap: 12px; }
.catrow-h .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.catrow-h .v { font-weight: 700; }

.tx { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 16px; background: none; border: 0; text-align: left; position: relative; }
.tx + .tx::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; border-top: .5px solid var(--sep); }
.tx:active { background: var(--fill); }
.tx-m { flex: 1; min-width: 0; }
.tx-m b { display: flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-m b svg { color: var(--faint); font-size: 12px; }
.tx-m span { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
.tx-v { font-weight: 600; white-space: nowrap; }
.tx-v.out { color: var(--text); }
.tx-v.in { color: var(--text); font-weight: 700; }

.empty { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 26px 8px; color: var(--muted); font-size: 14px; }
.empty svg { font-size: 30px; color: var(--faint); stroke-width: 1.4; }
.empty b { color: var(--text); font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -.02em; margin-top: 8px; }

.alert { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--r); background: var(--card); font-size: 14px; }
.alert svg { font-size: 19px; }
.alert.over svg { color: var(--danger); }
.alert.warn svg { color: var(--warn); }

.cta { display: flex; align-items: center; gap: 12px; }
.cta-ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 19px; background: var(--accent); color: var(--on-accent); flex: none; }
.cta-ic.red { background: var(--accent); }
.cta-m { flex: 1; min-width: 0; }
.cta-m b { display: block; font-weight: 600; font-size: 15px; }
.cta-m p { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* ---------- botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
  min-height: 50px; padding: 12px 18px; border-radius: 14px; border: 0;
  font-weight: 600; font-size: 16px; color: var(--on-accent); background: var(--accent);
  transition: transform .12s, opacity .15s;
}
.btn:active { transform: scale(.98); opacity: .85; }
.btn.sm { width: auto; min-height: 34px; padding: 7px 14px; font-size: 14px; border-radius: 999px; flex: none; }
.btn.soft { background: var(--fill); color: var(--text); }
.btn.ghost { background: var(--fill); color: var(--text); }
.btn.danger { background: var(--fill); color: var(--danger); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.iconbtn { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--fill); display: grid; place-items: center; font-size: 14px; color: var(--muted); }
.iconbtn svg { stroke-width: 2.6; }

/* ---------- seletores ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px; white-space: nowrap;
  border: 0; background: var(--card); font-size: 14px; font-weight: 500;
}
.chip svg { color: var(--muted); font-size: 15px; }
.chip.on { background: var(--accent); color: var(--on-accent); }
.chip.on svg { color: var(--on-accent); }
.sheet .chip { background: var(--card); }
.sheet .chip.on { background: var(--accent); }

/* controle segmentado (iOS) */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; background: var(--fill); border-radius: 10px; }
.seg button {
  border: 0; background: none; border-radius: 8px; padding: 7px 2px; min-width: 0;
  display: grid; justify-items: center; gap: 2px; font-size: 13px; font-weight: 500; color: var(--text);
}
.seg button svg { font-size: 17px; }
.seg button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.seg button.on { background: var(--seg-on); font-weight: 600; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04); }
.seg:not(.flat) button { padding-block: 8px; font-size: 11.5px; }

/* ---------- formulários ---------- */
.form { display: grid; gap: 6px; }
.lab { font-size: 13px; font-weight: 500; color: var(--muted); margin: 10px 4px 0; }
.field {
  width: 100%; border: 1px solid transparent; background: var(--card); border-radius: 12px;
  padding: 13px 14px; font-size: 16px; outline: none; transition: border-color .15s;
}
.field:focus { border-color: var(--accent); }
.field[readonly] { color: var(--muted); }
.field.mono { font-family: var(--mono); font-size: 12px; min-height: 210px; resize: vertical; line-height: 1.55; letter-spacing: 0; color: var(--text); }
.amount { display: flex; align-items: baseline; gap: 8px; border: 1px solid transparent; background: var(--card); border-radius: 16px; padding: 4px 16px; }
.amount:focus-within { border-color: var(--accent); }
.amount span { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--faint); }
.amount input { border: 0; background: none; outline: none; width: 100%; min-width: 0; padding: 6px 0; font-family: var(--display); font-size: 40px; font-weight: 700; line-height: 1.15; letter-spacing: -.035em; }
.amount input::placeholder { color: var(--faint); }
.err { font-size: 13px; font-weight: 500; color: var(--danger); min-height: 1.1em; padding-inline: 4px; }
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
.icons button { height: 46px; border-radius: 12px; border: 0; background: var(--card); display: grid; place-items: center; font-size: 20px; color: var(--muted); }
.icons button.on { background: var(--accent); color: var(--on-accent); }

.setrow { display: flex; align-items: center; gap: 12px; padding-block: 11px; width: 100%; background: none; border: 0; text-align: left; position: relative; }
.list > .setrow + .setrow::before { content: ""; position: absolute; top: 0; left: 44px; right: 0; border-top: .5px solid var(--sep); }
.setrow-m { flex: 1; min-width: 0; }
.setrow-m b { display: block; font-weight: 600; }
.setrow-m span { display: block; font-size: 13px; color: var(--muted); margin-top: 1px; }
.setrow > b.num { font-weight: 700; }
.namefield { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 16px; padding: 4px 0; }
.switch { width: 51px; height: 31px; border-radius: 16px; border: 0; background: var(--fill-2); position: relative; flex: none; transition: background .25s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16); transition: left .25s cubic-bezier(.2, .8, .2, 1); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 22px; background: var(--knob-on); }
.note { display: flex; gap: 10px; margin-top: 8px; padding-top: 12px; border-top: .5px solid var(--sep); font-size: 13px; line-height: 1.45; color: var(--muted); }
.note svg { color: var(--text); font-size: 17px; }

/* ---------- folhas e avisos ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: 100%; max-width: var(--col); max-height: 93vh; overflow-y: auto;
  background: var(--bg); border-radius: 14px 14px 0 0; box-shadow: var(--sheet-shadow);
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  animation: up .35s cubic-bezier(.2, .9, .25, 1);
}
@keyframes up { from { transform: translateY(100%); } }
.sheet-grip { width: 36px; height: 5px; border-radius: 3px; background: var(--fill-2); margin: 6px auto 0; }
.sheet-hd { display: flex; align-items: center; justify-content: space-between; padding-block: 10px 8px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.sheet-hd b { font-size: 17px; font-weight: 600; }
.sheet-bd { display: grid; gap: 10px; padding-block: 6px 8px; }
.sheet-bd > .muted { padding-inline: 4px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  background: var(--accent); color: var(--on-accent); padding: 11px 18px; border-radius: 999px;
  font-weight: 500; font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .2); animation: fade .2s;
  max-width: calc(100vw - 32px); text-align: center;
}

/* campos e ícones sobre cartões cinza */
.card .field, .card .amount { background: var(--surface); }
.ci { background: var(--surface); }
.sheet .ci, .gate .ci { background: var(--card); }

/* ---------- atalhos de lançamento ---------- */
.quickadd { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qa {
  display: flex; align-items: center; gap: 12px; padding: 14px; min-height: 68px; min-width: 0;
  border: 0; border-radius: var(--r); background: var(--card); text-align: left;
  transition: transform .12s, background .15s;
}
.qa:active { transform: scale(.97); }
.qa-ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; flex: none; background: var(--surface); color: var(--text); }
.qa-ic svg { stroke-width: 2.4; }
.qa.main .qa-ic { background: var(--accent); color: var(--on-accent); }
.qa-t { min-width: 0; }
.qa-t b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
.qa-t small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.quickadd.sm { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: -2px; }
.quickadd.sm .qa { flex-direction: column; align-items: flex-start; gap: 8px; min-height: 0; padding: 12px; }
.quickadd.sm .qa-ic { width: 32px; height: 32px; font-size: 16px; }
.quickadd.sm .qa-t b { font-size: 14px; font-weight: 700; }

/* ---------- compra parcelada ---------- */
.badge { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: 0; padding: 2px 6px; border-radius: 6px; background: var(--fill); color: var(--text); flex: none; }
.seg.mode { margin-bottom: 4px; }
.seg.valmode { margin-top: 10px; }
.seg button:disabled { opacity: .35; }
.chips.parc { gap: 6px; }
.chips.parc .chip { min-width: 52px; justify-content: center; font-weight: 700; padding-inline: 10px; }
.countrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; padding: 10px 14px; border-radius: 12px; background: var(--card); }
.countrow label { font-size: 14px; color: var(--muted); }
.countbox { display: inline-flex; align-items: baseline; gap: 2px; padding: 6px 12px; border-radius: 10px; background: var(--surface); }
.countbox input { width: 2.4ch; border: 0; background: none; outline: none; text-align: right; font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
.countbox i { font-style: normal; font-weight: 700; color: var(--muted); }
.countbox:focus-within { box-shadow: inset 0 0 0 1.5px var(--accent); }
.parc-preview { display: grid; gap: 2px; margin-top: 10px; padding: 14px 16px; border-radius: 14px; background: var(--accent); color: var(--on-accent); }
.parc-preview b { font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -.035em; }
.parc-preview span { font-size: 13px; opacity: .78; }

/* botão principal fixo da aba (ex.: Adicionar lançamento) */
.primary-wrap {
  position: fixed; left: 0; right: 0; z-index: 29; pointer-events: none;
  bottom: calc(66px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.primary-btn {
  pointer-events: auto; display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; max-width: calc(var(--col) - 32px); margin: 0 auto; min-height: 54px; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--on-accent); font-size: 17px; font-weight: 700; letter-spacing: -.02em;
  box-shadow: 0 0 0 6px var(--bg), 0 12px 28px -10px rgba(0, 0, 0, .45);
  transition: transform .12s;
}
.primary-btn svg { font-size: 20px; stroke-width: 2.6; }
.primary-btn:active { transform: scale(.98); }
#app.has-primary { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
body:has(#app.has-primary) .toast { bottom: calc(136px + env(safe-area-inset-bottom, 0px)); }

/* ---------- Limites ---------- */
.intro p { color: var(--muted); font-size: 14px; line-height: 1.5; }
.intro-total { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-top: 12px; padding-top: 12px; border-top: .5px solid var(--sep); }
.intro-total span { font-size: 13px; color: var(--muted); }
.intro-total b { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -.04em; }
.intro-total small { font-size: 12px; color: var(--muted); width: 100%; }
.lim { padding-block: 12px; }
.lim-row { display: flex; align-items: center; gap: 10px; }
.lim-who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; text-align: left; }
.lim-who > span:last-child { min-width: 0; }
.lim-who b { display: flex; align-items: center; gap: 5px; font-weight: 600; }
.lim-who b svg { font-size: 12px; color: var(--faint); }
.lim-who small { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.limbox { display: flex; align-items: baseline; gap: 4px; width: 128px; flex: none; padding: 6px 10px; border-radius: 10px; background: var(--surface); }
.limbox span { color: var(--muted); font-size: 13px; }
.limbox input { border: 0; background: none; outline: none; width: 100%; min-width: 0; text-align: right; font-weight: 700; padding: 2px 0; }
.limbox input::placeholder { color: var(--faint); font-weight: 400; }
.limbox:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }

/* ---------- Relatórios ---------- */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--card); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.kpi.wide { grid-column: 1 / -1; }
.kpi span { font-size: 13px; color: var(--muted); }
.kpi b { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: -.035em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.wide b { font-size: 34px; font-weight: 800; letter-spacing: -.05em; }
.kpi b.out, .kpi b.in { color: var(--text); }
.kpi small { font-size: 13px; color: var(--muted); }
.delta { display: inline-flex; align-items: center; gap: 3px; justify-self: start; font-size: 12px; font-weight: 700; padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--surface); margin-top: 4px; }
.delta svg { stroke-width: 2.4; }
.delta.bad { color: var(--danger); }
.delta.good { color: var(--text); }
.delta.flat { color: var(--muted); font-weight: 500; padding-left: 8px; }

.rbar { padding-block: 12px; }
.rbar + .rbar { border-top: .5px solid var(--sep); }
.rbar-h { display: flex; align-items: center; gap: 12px; }
.rbar-h .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rbar-h .v { font-weight: 700; }
.rbar-track { height: 4px; border-radius: 2px; background: var(--fill-2); overflow: hidden; margin-top: 10px; }
.rbar-track i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.rbar-track i.over { background: var(--danger); }

.pillrow { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--card); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.pill.warn::before { background: var(--warn); }
.pill.over::before { background: var(--danger); }

.toprow { display: flex; align-items: center; gap: 14px; padding-block: 11px; }
.toprow + .toprow { border-top: .5px solid var(--sep); }
.rank { font-family: var(--display); font-weight: 800; font-size: 20px; color: var(--faint); width: 18px; text-align: center; line-height: 1; }
.toprow-m { flex: 1; min-width: 0; }
.toprow-m b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toprow-m span { display: block; font-size: 13px; color: var(--muted); }
.toprow > b.num { font-weight: 700; color: var(--text); }

.mailcard { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
</style>
</head>
